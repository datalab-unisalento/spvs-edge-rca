[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto_mqtt_broker:1883"]
    topics = ["smartpv/power"]
    data_format = "json_v2"
    
    [[inputs.mqtt_consumer.topic_parsing]]
        topic = "smartpv/power"
        tags = "_/type"
        measurement = "measurement/_"
    
    [[inputs.mqtt_consumer.json_v2]]
        timestamp_path = "timestamp"
        timestamp_format = "unix"
        
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.current"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.bus_voltage"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.power"
            type = "float"
            optional = true

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto_mqtt_broker:1883"]
    topics = ["smartpv/pose"]
    data_format = "json_v2"
    
    [[inputs.mqtt_consumer.topic_parsing]]
        topic = "smartpv/pose"
        tags = "_/type"
        measurement = "_/measurement"
    
    [[inputs.mqtt_consumer.json_v2]]
        timestamp_path = "timestamp"
        timestamp_format = "unix"
        
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "orientation.yaw"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "orientation.pitch"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "orientation.roll"
            type = "float"
            optional = true

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto_mqtt_broker:1883"]
    topics = ["smartpv/position"]
    data_format = "json_v2"
    name_override = "position"

    [[inputs.mqtt_consumer.json_v2]]
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "coordinates.lat"
            type = "float"
            optional = true

        [[inputs.mqtt_consumer.json_v2.field]]
            path = "coordinates.lon"
            type = "float"
            optional = true

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto_mqtt_broker:1883"]
    topics = ["smartpv/+/simulation"]
    data_format = "json_v2"
    
    [[inputs.mqtt_consumer.topic_parsing]]
        topic = "smartpv/+/simulation"
        tags = "_/pv-id/_"
        measurement = "_/_/measurement"

    [[inputs.mqtt_consumer.json_v2]]
        timestamp_path = "timestamp"
        timestamp_format = "unix"
        
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.current"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.bus_voltage"
            type = "float"
            optional = true
            
        [[inputs.mqtt_consumer.json_v2.field]]
            path = "panel.power"
            type = "float"
            optional = true


